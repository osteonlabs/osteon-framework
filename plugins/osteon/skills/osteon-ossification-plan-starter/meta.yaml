negative_knowledge:
  - id: NK-1
    type: do-not-reintroduce
    text: "Do not start an ossification because its plan's author says it is ready. Run the gate and record a verdict per condition."
    cause: "A plan's author is the worst-placed reader of it, because an omission has no text to notice. The transition from plan to work has historically been made by assertion, and the cost lands weeks later as work scheduled twice or serialised for no reason."
