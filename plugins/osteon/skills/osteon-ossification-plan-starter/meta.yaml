    expires: null
  - id: NK-2
    type: do-not-reintroduce
    text: "Do not report that open questions exist and stop. Ask them, one decision per question, with options and their consequences."
    cause: "A gate that converts a decision into a status line leaves the decision unmade and the plan blocked, while appearing to have done its job. Dozens of separate ask tasks once collapsed to one message that was drafted and never sent, and no task in the plan performed the sending."
    src: null
    expires: null
  - id: NK-3
    type: do-not-reintroduce
    text: "Do not trust the gate checker's pass without running it against an input that must fail."
    cause: "The checker is code with the same defects as the code it gates. One draft over-reported unfalsifiable definitions of done through a strict pattern while under-reporting duplicates by comparing ids rather than meaning."
    src: null
    expires: null
