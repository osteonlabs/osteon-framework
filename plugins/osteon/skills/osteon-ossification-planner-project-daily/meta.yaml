negative_knowledge:
  - id: NK-1
    type: do-not-reintroduce
    text: "Do not treat a merged change request as done because it merged. Walk its post-merge actions and see each one green first."
    cause: "A merge moves code and walks no checklist. Configuration steps, deploys and verification steps declared in a change request body are discovered undone days later, by which time the person who could do them has moved on and the reader assumes a merged change request was finished."
    src: null                       # T0 has no project ledger to cite; see bone-skills/README.md section 4
    expires: null
  - id: NK-2
    type: do-not-reintroduce
    text: "Do not open a day's plan while a question that day's work depends on is unanswered and unrouted."
    cause: "Work built on an assumption the one person who could have corrected it was never asked for is work that has to be redone, and the cost is paid at the end of the day rather than the start."
    src: null
    expires: null
  - id: NK-3
    type: do-not-reintroduce
    text: "Do not hold the cycle inside a code repository, and do not keep one cycle per repository."
    cause: "A day's work crosses repositories and its post-merge actions cross back the other way. A cycle held in one repository can record only its own half, so the cross-repository half goes missing in exactly the place it matters, owned by neither side. The BONE is the only place that can see every repository at once."
    src: null
    expires: null
