negative_knowledge:
  - id: NK-1
    type: do-not-reintroduce
    text: "Do not treat a cannot-verify edge as a cannot-start edge when cutting lanes."
    cause: "A constraint on when something can be PROVED is not a constraint on when it can be built. Conflating them serialises lanes that share no surface, and the resulting critical path is invented by the plan rather than found in the work. One plan stalled several concurrent lanes behind a decision none of them depended on."
    src: null                       # T0 has no project ledger to cite; see bone-skills/README.md section 4
    expires: null
  - id: NK-2
    type: do-not-reintroduce
    text: "Do not cut lanes on subject matter. Cut them on exclusive shared surfaces."
    cause: "Two lanes that both reach one state file, one protected branch or one migration chain cannot be applied independently however unrelated their subjects are. Several change requests were once planned against one shared surface that applies every pending change together."
    src: null
    expires: null
  - id: NK-3
    type: do-not-reintroduce
    text: "Do not accept a subtask's own report of a fresh claim as the verdict, and do not let a subtask merge."
    cause: "A subtask that reports its own work marks it done, and roughly a fifth of such claims do not survive a sibling whose only instruction is to refute them. A plan that overstates what is finished is worse than a stale one, because nobody re-checks a line already struck through."
    src: null
    expires: null
